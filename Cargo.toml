[package]
name = "orch"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Keyboard-driven orchestrator for local coding agents"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
nix = { version = "0.30", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "sync", "signal", "time"] }
tracing = "0.1"
unicode-width = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }

[dev-dependencies]
tempfile = "3"
